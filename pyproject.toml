[build-system]
build-backend = "hatchling.build"
requires = [ "hatchling>=1.25" ]

[project]
name = "key-flip"
version = "0.1.0"
description = "key-flip is a utility that fixes text typed with the wrong keyboard layout."
readme = "README.md"
license = { file = "LICENSE" }
authors = [
  { name = "Vlad Korneev", email = "veenrok@veenrok.com" },
]
requires-python = ">=3.13"
classifiers = [
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]
dependencies = []
scripts.key-flip = "key_flip.cli.__main__:main"

[dependency-groups]
dev = [
  { include-group = "lint" },
  { include-group = "test" },
  { include-group = "git-hooks" },
]
lint = [
  "ruff>=0.14.5",
  "ty>=0.0.1a26",
  { include-group = "test" },
]
test = [
  "pytest>=9.0.1",
]
git-hooks = [
    "prek>=0.3.0",
]
